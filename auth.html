<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripWeaver 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-brand-panel">
        <p class="brand-eyebrow">TripWeaver</p>
        <h1>登录后继续你的旅行路线与社交流程</h1>
        <p class="brand-desc">支持密码登录、邮箱验证码注册/登录、第三方快捷登录。登录成功后自动返回你刚才的页面。</p>
        <ul class="brand-list">
          <li>路线与地图同步</li>
          <li>好友与群聊联动</li>
          <li>个性化地点推荐记忆</li>
        </ul>
      </section>

      <section class="auth-card-panel">
        <header class="auth-card-head">
          <strong>欢迎回来</strong>
          <span id="auth-next-hint">登录后返回应用</span>
        </header>

        <div id="auth-session-box" class="auth-session-box hidden"></div>

        <nav class="auth-tabs" aria-label="登录方式">
          <button class="auth-tab-btn active" type="button" data-auth-tab="login">密码登录</button>
          <button class="auth-tab-btn" type="button" data-auth-tab="register">注册</button>
          <button class="auth-tab-btn" type="button" data-auth-tab="code">邮箱验证码</button>
        </nav>

        <form id="auth-login-form" class="auth-form" data-auth-panel="login">
          <label>
            用户名 / 邮箱
            <input name="identifier" placeholder="输入用户名或邮箱" required />
          </label>
          <label>
            密码
            <input name="password" type="password" placeholder="输入密码" required />
          </label>
          <button class="btn-primary" type="submit">登录</button>
        </form>

        <form id="auth-register-form" class="auth-form hidden" data-auth-panel="register">
          <label>
            昵称
            <input name="displayName" placeholder="输入昵称" required />
          </label>
          <label>
            用户名
            <input name="username" placeholder="输入用户名（唯一）" required />
          </label>
          <label>
            邮箱（可选）
            <input name="email" type="email" placeholder="name@email.com" />
          </label>
          <label>
            密码
            <input name="password" type="password" placeholder="至少 6 位" required />
          </label>
          <button class="btn-primary" type="submit">创建账号</button>
        </form>

        <form id="auth-code-form" class="auth-form hidden" data-auth-panel="code">
          <label>
            邮箱
            <input name="identifier" type="email" placeholder="输入邮箱地址" required />
          </label>
          <div class="auth-inline">
            <label>
              验证码
              <input name="code" placeholder="输入验证码" required />
            </label>
            <button id="auth-request-code-btn" class="btn-secondary" type="button">获取验证码</button>
          </div>
          <label>
            首次登录昵称（可选）
            <input name="displayName" placeholder="新用户可填写" />
          </label>
          <button class="btn-primary" type="submit">邮箱验证码登录/注册</button>
        </form>

        <section class="oauth-wrap">
          <p>其他登录方式</p>
          <div class="oauth-row">
            <button class="btn-secondary oauth-btn" type="button" data-provider="google">Google</button>
            <button class="btn-secondary oauth-btn" type="button" data-provider="apple">Apple</button>
            <button class="btn-secondary oauth-btn" type="button" data-provider="wechat">WeChat</button>
            <button class="btn-secondary oauth-btn" type="button" data-provider="github">GitHub</button>
          </div>
        </section>

        <footer class="auth-footer-actions">
          <button id="auth-back-app-btn" class="btn-link" type="button">游客继续</button>
          <button id="auth-clear-token-btn" class="btn-link" type="button">退出当前账号</button>
        </footer>

        <p id="auth-message" class="auth-message" aria-live="polite"></p>
      </section>
    </main>

    <script src="./auth.js"></script>
  </body>
</html>
