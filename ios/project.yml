name: TripWeaveriOS
options:
  bundleIdPrefix: com.tripweaver
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  TripWeaveriOS:
    type: application
    platform: iOS
    sources:
      - path: TripWeaver
    resources:
      - path: TripWeaver/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripweaver.ios
        PRODUCT_NAME: TripWeaver
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TripWeaver
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
